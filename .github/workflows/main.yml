name: Check HUIT Facebook Posts

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt thư viện và trình duyệt Chromium
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Chạy script kiểm tra
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python check_fb.py

      - name: Lưu lại trạng thái bài viết mới nhất
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add last_post.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Cập nhật last_post.txt" && git push)
